name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # shared-types and sync-host must build first: core-backend and stage-pwa
      # import their compiled dist/ output, not their source.
      - name: Build shared-types and sync-host
        run: npm run build -w shared-types && npm run build -w sync-host

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      # The audio engine's C++ core (docs/30 §8h stage 1): offline tests, with sanitizers.
      - name: Audio engine (C++)
        run: |
          cmake -S native/engine -B build/engine -DSTAGEBOARD_ENGINE_SANITIZE=ON
          cmake --build build/engine
          ctest --test-dir build/engine --output-on-failure

      # The same core as WebAssembly (stage 2): the checked-in module must be what the source builds.
      - name: Audio engine (WebAssembly)
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  /tmp/wasi-sdk.tar.gz" | sha256sum -c
          tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp
          WASI_SDK=/tmp/wasi-sdk-29.0-x86_64-linux native/engine/wasm/build.sh /tmp/stageboard_engine.wasm
          cmp /tmp/stageboard_engine.wasm packages/stage-pwa/src/lib/engine/stageboard_engine.wasm || { echo "stageboard_engine.wasm is out of date - run native/engine/wasm/build.sh packages/stage-pwa/src/lib/engine/stageboard_engine.wasm"; exit 1; }
