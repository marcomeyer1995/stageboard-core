name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # shared-types and sync-host must build first: core-backend and stage-pwa
      # import their compiled dist/ output, not their source.
      - name: Build shared-types and sync-host
        run: npm run build -w shared-types && npm run build -w sync-host

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      # The audio engine's C++ core (docs/30 §8h stage 1): offline tests, with sanitizers.
      - name: Audio engine (C++)
        run: |
          cmake -S native/engine -B build/engine -DSTAGEBOARD_ENGINE_SANITIZE=ON
          cmake --build build/engine
          ctest --test-dir build/engine --output-on-failure
