; Mounted into /opt/couchdb/etc/local.d/00-ssl.ini - see #34 and scripts/generate-dev-certs.sh.
; local.d files load after default.ini and win on conflicting keys, without touching the
; image's own default.ini (which "Upgrading CouchDB will overwrite").
;
; Named 00-ssl.ini (not ssl.ini): CouchDB persists *any* runtime config change (via the
; HTTP _config API, or its own admin-password hashing) into whichever local.d file loads
; last alphabetically. Sorting this one first keeps it purely static - the container's own
; local.d/docker.ini (created by the base image's entrypoint, never bind-mounted into this
; repo) absorbs that instead. Confirmed the hard way: an early version of this file
; without the "00-" prefix ended up with a live admin password hash and CORS state
; committed into git after running scripts/setup-couchdb.sh once.
[ssl]
enable = true
cert_file = /opt/couchdb/etc/certs/dev-cert.pem
key_file = /opt/couchdb/etc/certs/dev-key.pem
port = 6984
