; Mounted into /opt/couchdb/etc/local.d/00-recovery.ini (#362). A deleted database is kept as
; `*.deleted.couch` shard files instead of being removed - on 2026-10-04 a band database was
; deleted by mistake and CouchDB kept nothing (it survived only via a device's local copy).
; Restore and clean-up: docs/03 §0b. Static like 00-ssl.ini (see there for why "00-").
[couchdb]
enable_database_recovery = true
